<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Simples</title>
    <style>
        .calculadora { border: 2px solid #333; padding: 10px; width: 200px; border-radius: 5px; }
        input { width: 100%; margin-bottom: 10px; text-align: right; }
        .botoes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        button { padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="calculadora">
    <input type="text" id="display" disabled>
    <div class="botoes">
        <button onclick="limpar()">C</button>
        <button onclick="add('/')">/</button>
        <button onclick="add('*')">x</button>
        <button onclick="apagar()">⌫</button>
        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button onclick="add('-')">-</button>
        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="add('+')">+</button>
        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="calcular()" style="grid-row: span 2">=</button>
        <button onclick="add('0')" style="grid-column: span 2">0</button>
        <button onclick="add('.')">.</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
